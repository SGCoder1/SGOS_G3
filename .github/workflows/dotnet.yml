# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "ci/test" ]
  pull_request:
    branches: [ "ci/test" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install COSMOS
      run: dotnet tool install -g Cosmos.Tools && cosmos install -y
    - name: Create a COSMOS Project
      run: cosmos new test
    - name: Create a global.json (to keep stable)
      run: dotnet new globaljson --sdk-version 10.0.100 --roll-forward latestMinor -o .\test\
    - name: Debug directory (PowerShell)
      if: always()
      run: |
        Get-Location
        Get-ChildItem -Recurse -Depth 3 -Filter "global.json"
    - name: Build with COSMOS
      run: cosmos build -p .\test\ -a x64 -c Debug -v
